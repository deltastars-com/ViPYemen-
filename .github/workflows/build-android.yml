name: Build Android (APK + AAB) + Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-synced
          path: android/

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-synced
          path: android/

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/keystore/vipyemen-release.p12
          cat > android/keystore.properties <<EOF
          storeFile=keystore/vipyemen-release.p12
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeType=PKCS12
          EOF

      - name: Build APK (unsigned if no keystore)
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create source code archive
        run: |
          tar czf vip-yemen-source-${{ steps.version.outputs.tag }}.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='android/.gradle' \
            --exclude='android/app/build' \
            --exclude='ios/App/build' \
            --exclude='ios/App/Pods' \
            .
          zip -r vip-yemen-source-${{ steps.version.outputs.tag }}.zip \
            src/ public/ android/app/build.gradle android/build.gradle \
            android/keystore/ android/keystore.properties \
            ios/App/App/Info.plist \
            capacitor.config.ts index.html package.json \
            store-listing.json SIGNING-AND-OWNERSHIP.md \
            PRIVACY-POLICY.md PRIVACY-POLICY-APP.md \
            codemagic.yaml .github/ \
            -x '*/node_modules/*' '*/.git/*' '*/dist/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ViP Yemen ${{ steps.version.outputs.tag }}"
          body: |
            ## ViP Yemen ${{ steps.version.outputs.tag }}

            ### تطبيقات Android
            - **APK** — ملف تثبيت مباشر للجهاز
            - **AAB** — حزمة Google Play Console

            ### تطبيقات iOS
            - يُبنى تلقائياً عبر Codemagic ويرفع إلى App Store Connect

            ### تطبيق الويب (PWA)
            - يعمل بدون إنترنت كتطبيق ويب تقدمي ثابت
            - يُحدَّث تلقائياً كل 30 دقيقة

            ### الكود المصدري
            - ملف مضغوط يشمل الواجهة + الباك إند + ملفات التوثيق

            ### ملفات التوثيق
            - SIGNING-AND-OWNERSHIP.md — ملفات التوقيع والملكية
            - PRIVACY-POLICY-APP.md — سياسة الخصوصية للمتاجر
            - store-listing.json — بيانات قوائم المتاجر
            - codemagic.yaml — إعدادات بناء iOS

            ### روابط مفيدة
            - الموقع: https://vipyemen.com
            - سياسة الخصوصية: https://vipyemen.com/privacy-policy
            - واتساب: 00967711780999
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            vip-yemen-source-${{ steps.version.outputs.tag }}.tar.gz
            vip-yemen-source-${{ steps.version.outputs.tag }}.zip
            store-listing.json
            SIGNING-AND-OWNERSHIP.md
            PRIVACY-POLICY.md
            PRIVACY-POLICY-APP.md
            codemagic.yaml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
