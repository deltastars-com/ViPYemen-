name: "🔒 قفل تبعيات Gradle (S8569)"

# لماذا هذا السير؟
# قاعدة Sonar text:S8569 ترفض غياب ملف قفل التبعيات (gradle.lockfile) في مشروع
# Gradle لأن إصدارات التبعيات غير متوقّعة بدونه. توليد الملف يتطلّب بيئة Android
# SDK كاملة — وهي متوفرة على عمال GitHub Actions — فنولّده هناك مرة واحدة (وأيضاً
# عند تغيّر ملفات Gradle) وندفعه إلى الفرع الرئيسي. بمجرد أن يصبح الملف موجوداً تُغلق
# الملاحظة، وتبقى بناءات Android الحالية كما هي (--write-locks لا يغيّر السلوك).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/build.gradle"
      - "android/app/build.gradle"
      - "android/variables.gradle"
      - "android/gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/gradle-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: gradle-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # وحدات Capacitor (project(':capacitor-android')…) تُحلَّ من node_modules —
      # نثبّتها بدون سكربتات دورة الحياة حتى يرى Gradle مجلدات المشاريع كاملة.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: تثبيت حزم node_modules (بدون سكربتات دورة الحياة)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # cap sync يولّد الملفات التي يطلبها Gradle من node_modules
      # (منها capacitor-cordova-android-plugins/cordova.variables.gradle) —
      # نفس الترتيب المعتمد في سير عمل الإصدار release.yml.
      - name: بناء الويب ثم مزامنة Capacitor
        run: |
          set -uo pipefail
          npm run build
          ./node_modules/.bin/cap sync android

      - name: تفعيل Android SDK (مثبّت مسبقاً على عمال GitHub)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      # --write-locks: يكتب حالة القفل لكل إعدادية قابلة للحل (المحلّة فعلياً)
      # بدون تغيير سلوك البناء المعتاد — الملفات الناتجة هي المرجع المستقبلي.
      - name: توليد ملفات القفل (gradle.lockfile)
        run: |
          set -uo pipefail
          cd android
          chmod +x gradlew
          # buildEnvironment: يحلّ classpath البناء في الجذر (buildscript) فيُكتب
          # android/gradle.lockfile — ومهمّة dependencies تُكتب قفل تبعيات كل مشروع.
          ./gradlew buildEnvironment dependencies :app:dependencies :app:assembleDebug --write-locks --no-daemon --console=plain

      - name: حفظ ملفات القفل إن تغيّرت
        run: |
          set -uo pipefail
          FILES=""
          [ -f android/gradle.lockfile ] && FILES="$FILES android/gradle.lockfile"
          [ -f android/app/gradle.lockfile ] && FILES="$FILES android/app/gradle.lockfile"
          if [ -z "$FILES" ]; then
            echo "##[error]لم يُولَّد أي ملف قفل — يحتاج تدخّلاً."
            exit 1
          fi
          # نرفع ملفات القفل فقط (لا ملفات المزامنة المولَّدة أو أصول الويب)
          git add $FILES
          if git diff --cached --quiet; then
            echo "لا تغيير في ملفات القفل — كل شيء محدَّث."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): توليد gradle.lockfile لقفل تبعيات Gradle (S8569)"
          git push
          echo "✅ دُفع ملف القفل إلى main."
