name: Mirrors (multi-provider free hosting)

# 🌐 نشر المنصة على عدة سيرفرات استضافة مجانية مستقلة في الوقت نفسه، ثم
# التحقق من أن كل مرآة تخدم النسخة الكاملة — فإذا تعطّل أي مزود، البقية
# تعمل، والتطبيقات الأصلية (APK/AAB/iOS) لا تتأثر أصلاً لأن واجهتها مدمجة.
#
# المرايا المفعلة:
#   • Vercel            — تلقائياً من تكامل Vercel (بلا إعداد هنا)
#   • Render            — تلقائياً من render.yaml (بلا إعداد هنا)
#   • GitHub Pages      — سير العمل pages.yml (مجاني رسمياً)
#   • Netlify           — هنا، عند وجود NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID
#   • Cloudflare Pages  — هنا، عند وجود CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#
# المرايا الاختيارية لا تُعطّل أبداً سير العمل: إن لم تكن المفاتيح مضبوطة
# تُتخطى بسلاسة ويبقى الباقي يعمل، مع تقرير واضح في ملخص التشغيل.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - "netlify.toml"
      - ".github/workflows/mirrors.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: نشر المرايا المجانية والتحقق منها
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://notable-shepherd-367.convex.cloud' }}
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت نظيف وحتمي
        run: npm ci --ignore-scripts

      - name: بناء نسخة الإنتاج
        run: npm run build

      # ── Netlify (اختياري — يتخطى بسلاسة إن لم تُضبط المفاتيح) ──────────
      - name: نشر إلى Netlify
        id: netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Netlify — لا مفاتيح (تعطيل اختياري)"
            exit 0
          fi
          # إصدار مثبّت (لا npx غير مثبّت) وبلا أي إضافة إلى تبعيات المستودع
          npx --yes netlify-cli@17.38.1 deploy --prod --dir=dist \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "release $GITHUB_SHA"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # ── Cloudflare Pages (اختياري) ────────────────────────────────────
      - name: نشر إلى Cloudflare Pages
        id: cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Cloudflare Pages — لا مفاتيح (تعطيل اختياري)"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=vipyemen --branch=main --commit-dirty=true
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: التحقق من كل المرايا
        id: verify
        env:
          EXTRA_MIRROR_URLS: ${{ vars.EXTRA_MIRROR_URLS }}
        run: |
          set -uo pipefail
          declare -a ROWS=()
          DOWN=0
          check() {
            local name="$1" url="$2"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -L "$url" 2>/dev/null || echo 000)
            printf '%-20s %s\n' "$name" "$code"
            if [ "$code" = "200" ]; then
              ROWS+=("| $name | ✅ | \`$url\` |")
            else
              ROWS+=("| $name | ⚠️ HTTP $code | \`$url\` |")
              DOWN=$((DOWN + 1))
            fi
          }

          check "Vercel"       "https://vi-p-yemen.vercel.app"
          check "Render"       "https://vipyemen.onrender.com"
          check "GitHub Pages" "https://deltastars-com.github.io/ViPYemen-/"
          check "Convex HTTP"  "https://notable-shepherd-367.convex.site/health"

          if [ -n "${EXTRA_MIRROR_URLS:-}" ]; then
            IFS=',' read -ra EXTRA <<< "$EXTRA_MIRROR_URLS"
            for entry in "${EXTRA[@]}"; do
              check "${entry%%|*}" "${entry#*|}"
            done
          fi

          {
            echo "### 🌐 حالة مرايا المنصة المجانية"
            echo ""
            echo "| المرآة | الحالة | الرابط |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${ROWS[@]}"
            echo ""
            echo "> التطبيقات الأصلية (APK/AAB/iOS) مستقلة تماماً: واجهتها مدمجة داخل الحزمة وتعمل دون أي استضافة."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "unhealthy=$DOWN" >> "$GITHUB_OUTPUT"

      - name: تقرير الخلاصة
        run: |
          echo "مرايا غير صحية: ${{ steps.verify.outputs.unhealthy }}"
          echo "Netlify: ${{ steps.netlify.outputs.enabled || 'false' }} · Cloudflare: ${{ steps.cloudflare.outputs.enabled || 'false' }}"
