name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# أقصى صلاحية لكل وظيفة على حدة (مبدأ أقل رخصة، S6763) — التوصية
# الأمنية لسير Actions Trophy تمنع منح الصلاحيات على مستوى السير.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate official icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      # 🔑 أسرار القنوات (فيسبوك · تيليجرام) → بيئة النشر على Convex.
      # قنوات النشر تُنفَّذ من أكشنات Convex وهي لا ترى أسرار GitHub إطلاقاً؛
      # فندفع القيم إلى النشر قبل ترقية الشيفرة (ولا تُطبع في السجلات أبداً).
      # يقبل السرّين CONVEX_DEPLOY_KEY أو VITE_CONVEX_DEPLOY_KEY — أيهما وُجد.
      - name: Sync channel secrets into the Convex deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY || secrets.VITE_CONVEX_DEPLOY_KEY }}
          FB_TOKEN_SECRET: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_SECRET: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_GROUP_SECRET: ${{ secrets.FACEBOOK_GROUP_ID }}
          TG_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "${CONVEX_DEPLOY_KEY:-}" ]]; then
            echo "::notice::لا يوجد مفتاح نشر في المستودع — تُتخطّى مزامنة أسرار القنوات (يمكن ضبطها من لوحة Convex مباشرة)."
            exit 0
          fi
          [[ -n "$FB_TOKEN_SECRET" ]] && ./node_modules/.bin/convex env set FACEBOOK_ACCESS_TOKEN "$FB_TOKEN_SECRET" --prod >/dev/null 2>&1 && echo "FACEBOOK_ACCESS_TOKEN synced (prod)" || true
          [[ -n "$FB_PAGE_SECRET" ]] && ./node_modules/.bin/convex env set FACEBOOK_PAGE_ID "$FB_PAGE_SECRET" --prod >/dev/null 2>&1 && echo "FACEBOOK_PAGE_ID synced (prod)" || true
          [[ -n "$FB_GROUP_SECRET" ]] && ./node_modules/.bin/convex env set FACEBOOK_GROUP_ID "$FB_GROUP_SECRET" --prod >/dev/null 2>&1 && echo "FACEBOOK_GROUP_ID synced (prod)" || true
          # `--` قبل القيمة: معرّفات محادثات تيليجرام قد تبدأ بـ - فيفسّرها CLI كخيار مجهول.
          [[ -n "$TG_TOKEN_SECRET" ]] && ./node_modules/.bin/convex env set TELEGRAM_BOT_TOKEN --prod -- "$TG_TOKEN_SECRET" >/dev/null 2>&1 && echo "TELEGRAM_BOT_TOKEN synced (prod)" || true
          [[ -n "$TG_CHAT_SECRET" ]] && ./node_modules/.bin/convex env set TELEGRAM_CHAT_ID --prod -- "$TG_CHAT_SECRET" >/dev/null 2>&1 && echo "TELEGRAM_CHAT_ID synced (prod)" || true

      # 🛡️ نشر الباك اند + تحديد العنوان الحيّ الذي سيتصل به التطبيق.
      # المنطق في إجراء مركزي واحد (‎.github/actions/resolve-convex‎) كي لا
      # تختلف نسخه بين السير عمل: يختار النشر الحامل للبيانات، ينشر الشيفرة
      # بالمفتاح المناسب، ويتحقق **فعلياً** أن استعلامات المنصة ترد قبل البناء.
      - name: Resolve the live Convex deployment (deploy + verify)
        id: convex
        uses: ./.github/actions/resolve-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          deploy-key-alt: ${{ secrets.VITE_CONVEX_DEPLOY_KEY }}
          configured-url: ${{ vars.VITE_CONVEX_URL || vars.VITE_CLOUD_URL || secrets.VITE_CONVEX_URL || secrets.VITE_CLOUD_URL }}
          gemini-key: ${{ secrets.VITE_GEMINI_KEY }}

      # GitHub Pages serves this repo under /ViPYemen-/, so the Pages build
      # must use that base for assets to resolve. The main site (Vercel /
      # vipyemen.com) keeps the default root base — only this build is
      # re-based for the /ViPYemen-/ subpath.
      # Bake the app version into the bundle from package.json so the in-app
      # update notifier can compare the running build against the latest
      # published release on every platform (including this Pages mirror).
      - name: Resolve app version for the build
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "VITE_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "app version: $VERSION"

      - name: Build (Pages base)
        run: ./node_modules/.bin/tsc -b && ./node_modules/.bin/vite build --base=/ViPYemen-/
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # GitHub Pages SPA fallback: any deep link (/jobs, /privacy-policy, …)
      # is served index.html through 404.html, so client-side routes work
      # on direct navigation and the privacy-policy link in store listings
      # resolves on the Pages mirror too.
      - name: Add SPA fallback for Pages
        run: cp dist/index.html dist/404.html

      # Standalone bilingual privacy policy (public/privacy-policy.html is
      # copied to dist by Vite). Served as a real 200-OK HTML page at
      # /privacy-policy/ — required by Google Play / App Store review crawlers
      # (a SPA route behind 404.html answers 404 to them).
      - name: Publish standalone privacy policy page
        run: |
          mkdir -p dist/privacy-policy
          cp dist/privacy-policy.html dist/privacy-policy/index.html

      # Same treatment for the data-deletion page Meta requires as
      # "Data Deletion Instructions URL" during data access renewal, and that
      # Google Play review crawlers fetch (they do not run JavaScript).
      - name: Publish standalone data deletion page
        run: |
          mkdir -p dist/data-deletion
          cp dist/data-deletion.html dist/data-deletion/index.html

      # Vercel previews every branch push by default, including this
      # generated gh-pages branch. That branch holds only build output (no
      # package.json), so Vercel's install step fails there and paints the
      # repo's Deployments panel with a red ❌ Preview entry. Shipping a
      # branch-level vercel.json that disables deployments for this branch
      # keeps the panel green without touching the real site.
      - name: Skip Vercel previews for this generated branch
        run: printf '%s\n' '{"git":{"deploymentEnabled":false}}' > dist/vercel.json

      # Publish to the gh-pages branch — acted as a backup mirror alongside
      # the official GitHub Actions page deployment (see deploy job below).
      # The repo's GitHub Pages source is set to a GitHub Actions deployment,
      # not to a branch; this push keeps a clean mirror copy for mirrors that
      # read the branch directly without requiring the Actions artifact.
      - name: Publish to gh-pages branch (backup mirror)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Pages deploy: ${{ github.sha }}"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
