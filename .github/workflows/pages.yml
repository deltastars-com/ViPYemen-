name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate official icons
        run: bun run icons

      - name: Typecheck
        run: bun run typecheck

      # Deploy the Convex backend with the deploy key and use the real
      # deployment URL from Convex's own output, so the deployed PWA always
      # talks to the live backend and the dashboard/sections are functional.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(npx convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            echo "::error::Neither VITE_CONVEX_URL (repo variable) nor CONVEX_DEPLOY_KEY (secret) is set. The dashboard and sections cannot work without a backend URL. Set CONVEX_DEPLOY_KEY and re-run."
            exit 1
          fi

      # GitHub Pages serves this repo under /ViPYemen-/, so the Pages build
      # must use that base for assets to resolve. The main site (Vercel /
      # vipyemen.com) keeps the default root base — only this build is
      # re-based for the /ViPYemen-/ subpath.
      - name: Build (Pages base)
        run: bunx tsc -b && bunx vite build --base=/ViPYemen-/
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}

      # GitHub Pages SPA fallback: any deep link (/jobs, /privacy-policy, …)
      # is served index.html through 404.html, so client-side routes work
      # on direct navigation and the privacy-policy link in store listings
      # resolves on the Pages mirror too.
      - name: Add SPA fallback for Pages
        run: cp dist/index.html dist/404.html

      # Publish to the gh-pages branch — the repo's Pages site is served from
      # this branch ("Deploy from a branch" source), which GitHub auto-builds
      # on every push. This path is not subject to the github-pages
      # environment protection rules that block native Actions deploys.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Pages deploy: ${{ github.sha }}"
