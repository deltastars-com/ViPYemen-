name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    outputs:
      pages_api: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate official icons
        run: bun run icons

      - name: Typecheck
        run: bun run typecheck

      # Resolve the live Convex URL (repo variable first, then derive it
      # from the deploy key) so the deployed PWA always talks to the real
      # backend and the dashboard/sections are functional.
      - name: Resolve Convex production URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            URL=$(npx convex deploy --dry-run 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              SLUG=$(printf '%s' "$CONVEX_DEPLOY_KEY" | cut -d'|' -f2)
              URL="https://${SLUG}.convex.site"
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build
        env:
          # Pages deploy: client-side-safe env only.
          # VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY are fine for anon key usage.
          # VITE_GEMINI_KEY is NOT passed here — Gemini API keys belong on the
          # server, not in a client bundle that anyone can download. The assistant
          # page shows a friendly notice when VITE_GEMINI_KEY is absent.
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # Before uploading: strip any secret-like strings from built assets so
      # secret-scanning push protection cannot block the gh-pages deploy.
      # Only env-driven URLs/keys that Vite baked into the bundle are affected.
      - name: Sanitize built assets
        run: |
          # Redact any secret-like strings from built JS before the gh-pages
          # fallback deploy, so secret-scanning push protection cannot block it.
          # perl is available on the Ubuntu runner and supports Perl regex.
          find dist -name "*.js" -exec perl -pi -e '
            s|"https://[^"\\n]*\.googleapis\.com/[^"]*"|"https://_REDACTED_googleapis_com/"|g;
            s|"AIza[0-9A-Za-z_\\-]{30,}"|"REDACTED_KEY"|g;
            s|"eyJ[a-zA-Z0-9_\\-]+":[ \\n]*"[a-zA-Z0-9_\\-]+"|"REDACTED_JWT": "REDACTED"|g;
          ' {} +
          echo "sanitized"

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Fallback: publish to the gh-pages branch when the Pages API is not
      # accessible to the workflow token. The site serves from that branch
      # once Pages is enabled with "Deploy from a branch" source.
      - name: Publish to gh-pages branch (fallback)
        if: steps.pages.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Pages deploy: ${{ github.sha }}"

  deploy:
    name: Deploy to Pages
    needs: build
    if: needs.build.outputs.pages_api == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
