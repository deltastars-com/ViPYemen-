name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate official icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      # Deploy the Convex backend with the deploy key and use the real
      # deployment URL from Convex's own output, so the deployed PWA always
      # talks to the live backend and the dashboard/sections are functional.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GEMINI_KEY_SECRET: ${{ secrets.VITE_GEMINI_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
          FB_TOKEN_SECRET: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_SECRET: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_GROUP_SECRET: ${{ secrets.FACEBOOK_GROUP_ID }}
          TG_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Keep the Gemini key in the Convex SERVER environment (never in the
          # client bundle). The client AI engine calls the server action, so a
          # repo secret is propagated to the deployment on every backend push.
          if [[ -n "$GEMINI_KEY_SECRET" && -n "$CONVEX_DEPLOY_KEY" ]]; then
            ./node_modules/.bin/convex env set GEMINI_KEY "$GEMINI_KEY_SECRET" --prod >/dev/null 2>&1 && \
              echo "GEMINI_KEY synced to Convex server env" || \
              echo "::warning::Could not sync GEMINI_KEY to Convex env (deploy key missing?) — AI falls back to the free engine until the key is set in the Convex dashboard."
          fi
          # Sync the channel publishing secrets (Facebook Page + Group) to the
          # Convex SERVER environment so auto-publish works on the deployment
          # the deploy key actually targets — regardless of where the values
          # were set in the dashboard.
          if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            [[ -n "$FB_TOKEN_SECRET" ]] && ./node_modules/.bin/convex env set FACEBOOK_ACCESS_TOKEN "$FB_TOKEN_SECRET" --prod >/dev/null 2>&1 && echo "FACEBOOK_ACCESS_TOKEN synced (prod)" || true
            [[ -n "$FB_PAGE_SECRET" ]] && ./node_modules/.bin/convex env set FACEBOOK_PAGE_ID "$FB_PAGE_SECRET" --prod >/dev/null 2>&1 && echo "FACEBOOK_PAGE_ID synced (prod)" || true
            [[ -n "$FB_GROUP_SECRET" ]] && ./node_modules/.bin/convex env set FACEBOOK_GROUP_ID "$FB_GROUP_SECRET" --prod >/dev/null 2>&1 && echo "FACEBOOK_GROUP_ID synced (prod)" || true
            [[ -n "$TG_TOKEN_SECRET" ]] && ./node_modules/.bin/convex env set TELEGRAM_BOT_TOKEN "$TG_TOKEN_SECRET" --prod >/dev/null 2>&1 || true
            [[ -n "$TG_CHAT_SECRET" ]] && ./node_modules/.bin/convex env set TELEGRAM_CHAT_ID "$TG_CHAT_SECRET" --prod >/dev/null 2>&1 || true
          fi
          # 🛡️ العنوان المُعدّ هو المرجع دائماً (قواعد البيانات منفصلة لكل نشر)،
          # ومفتاح النشر يُستخدم لنشر الشيفرة فقط مع تحقّق أنه يستهدف نفس النشر.
          # [حراسة لاحقة أسفل هذا السطر تُصحّح أي عنوان يختلف عن المُعدّ]
          if [[ -n "$VITE_CONVEX_URL_VAR" && "$VITE_CONVEX_URL_VAR" =~ ^https://[a-z0-9-]+\.convex\.(cloud|site)$ ]]; then
            if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
              DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
                echo "$DEPLOY_OUT"
                echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
                exit 1
              }
              echo "$DEPLOY_OUT"
              DEPLOYED=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
              CONFIGURED_HOST=$(printf '%s' "$VITE_CONVEX_URL_VAR" | sed -E 's#^https://([^/]+).*#\1#')
              DEPLOYED_HOST=$(printf '%s' "$DEPLOYED" | sed -E 's#^https://([^/]+).*#\1#')
              if [[ -n "$DEPLOYED_HOST" && "$DEPLOYED_HOST" != "$CONFIGURED_HOST" ]]; then
                echo "::error::CONVEX_DEPLOY_KEY ينشر إلى ($DEPLOYED_HOST) بينما عنوان الإنتاج المُعدّ ($CONFIGURED_HOST) — سنوقف البناء بدل نشر موقع يشير إلى قاعدة بيانات فارغة."
                echo "::error::الحل: أنشئ مفتاح نشر للنشر $CONFIGURED_HOST، أو انقل البيانات إلى $DEPLOYED_HOST واجعل العنوان يشير إليه."
                exit 1
              fi
            fi
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "::warning::VITE_CONVEX_URL repo variable is not a valid Convex URL (ignored) — resolving the real URL via CONVEX_DEPLOY_KEY instead."
            if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
              echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
              DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
                echo "$DEPLOY_OUT"
                echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
                exit 1
              }
              echo "$DEPLOY_OUT"
              URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
              if [[ -z "$URL" ]]; then
                echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
                exit 1
              fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "deployed and resolved: $URL"
            else
              echo "::warning::VITE_CONVEX_URL is invalid and CONVEX_DEPLOY_KEY is not set. Using the built-in live production URL — the app still connects to the live backend."
              echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            # No valid URL and no deploy key: the client bundle carries the
            # known-good live deployment URL as its built-in fallback, so the
            # app still connects to the live backend. Warn loudly instead of
            # failing the whole build.
            echo "::warning::No valid VITE_CONVEX_URL and no CONVEX_DEPLOY_KEY secret. Using the built-in live production URL (https://notable-shepherd-367.convex.cloud). Add CONVEX_DEPLOY_KEY as a repo SECRET to auto-deploy backend changes."
            echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
          fi

          # 🛡️ حارس العنوان: العنوان المُعدّ (متغير المستودع، وإلا الافتراضي الحيّ
          # الذي يحوي بيانات المستخدمين) هو ما يتّصل به التطبيق — دائماً.
          # إن نشر `convex deploy` إلى نشر آخر، فقواعد البيانات منفصلة: التطبيق
          # سيُبنى على منصة فارغة (0 طلب · 0 إعلان). لذلك نصحّح العنوان هنا
          # ونُطلق تحذيراً صاخباً بدل شحن تطبيق ميت.
          CONFIGURED_URL="$VITE_CONVEX_URL_VAR"
          if ! [[ "$CONFIGURED_URL" =~ ^https://[a-z0-9-]+\.convex\.(cloud|site)$ ]]; then
            CONFIGURED_URL="https://notable-shepherd-367.convex.cloud"
          fi
          RESOLVED_URL=$(grep -E '^url=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2- || true)
          if [[ -n "$RESOLVED_URL" && "$RESOLVED_URL" != "$CONFIGURED_URL" ]]; then
            echo "::error::نشر CONVEX_DEPLOY_KEY إلى ($RESOLVED_URL) بينما العنوان المُعدّ ($CONFIGURED_URL). قواعد البيانات منفصلة، فالتطبيق على الأول سيظهر فارغاً."
            echo "::warning::تم تثبيت عنوان التطبيق على $CONFIGURED_URL (النشر الحيّ الحامل للبيانات). الشيفرة نُشرت إلى $RESOLVED_URL."
            echo "::error::الحل: أنشئ مفتاح نشر للنشر $CONFIGURED_URL من لوحته في Convex، أو انقل البيانات إلى النشر المنشور ثم اجعل متغير المستودع VITE_CONVEX_URL يشير إليه."
            grep -v '^url=' "$GITHUB_OUTPUT" > "$GITHUB_OUTPUT.tmp" || true
            mv "$GITHUB_OUTPUT.tmp" "$GITHUB_OUTPUT"
            echo "url=$CONFIGURED_URL" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Pages serves this repo under /ViPYemen-/, so the Pages build
      # must use that base for assets to resolve. The main site (Vercel /
      # vipyemen.com) keeps the default root base — only this build is
      # re-based for the /ViPYemen-/ subpath.
      # Bake the app version into the bundle from package.json so the in-app
      # update notifier can compare the running build against the latest
      # published release on every platform (including this Pages mirror).
      # 🛡️ بوّابة السلامة: لا ننشر PWA يشير إلى نشر لا يخدم المنصة فعلاً
      # (نشر جديد بلا داتا ولا HTTP Actions) — كان الموقع سيُبنى ميتاً بصمت.
      - name: Verify the resolved deployment serves the platform
        env:
          RESOLVED_URL: ${{ steps.convex.outputs.url }}
        run: |
          set -uo pipefail
          SITE="${RESOLVED_URL%.convex.cloud}.convex.site"
          CODE=$(curl -sS -m 30 -o /tmp/h.json -w '%{http_code}' "$SITE/health" || echo 000)
          BODY=$(head -c 300 /tmp/h.json 2>/dev/null || true)
          if [ "$CODE" != "200" ] || printf '%s' "$BODY" | grep -q "does not have HTTP actions enabled"; then
            echo "::error::النشر $RESOLVED_URL لا يخدم المنصة (HTTP $CODE) — لن ننشر PWA يشير إليه."
            echo "::error::فعّل HTTP Actions عليه من لوحة Convex (Settings ← HTTP Actions) أو صحّح CONVEX_DEPLOY_KEY ليشير إلى النشر الحيّ $SITE."
            printf '%s\n' "$BODY"
            exit 1
          fi
          echo "✅ النشر $RESOLVED_URL يخدم المنصة فعلياً (HTTP $CODE) — النشر آمن."

      - name: Resolve app version for the build
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "VITE_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "app version: $VERSION"

      - name: Build (Pages base)
        run: ./node_modules/.bin/tsc -b && ./node_modules/.bin/vite build --base=/ViPYemen-/
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # GitHub Pages SPA fallback: any deep link (/jobs, /privacy-policy, …)
      # is served index.html through 404.html, so client-side routes work
      # on direct navigation and the privacy-policy link in store listings
      # resolves on the Pages mirror too.
      - name: Add SPA fallback for Pages
        run: cp dist/index.html dist/404.html

      # Standalone bilingual privacy policy (public/privacy-policy.html is
      # copied to dist by Vite). Served as a real 200-OK HTML page at
      # /privacy-policy/ — required by Google Play / App Store review crawlers
      # (a SPA route behind 404.html answers 404 to them).
      - name: Publish standalone privacy policy page
        run: |
          mkdir -p dist/privacy-policy
          cp dist/privacy-policy.html dist/privacy-policy/index.html

      # Same treatment for the data-deletion page Meta requires as
      # "Data Deletion Instructions URL" during data access renewal, and that
      # Google Play review crawlers fetch (they do not run JavaScript).
      - name: Publish standalone data deletion page
        run: |
          mkdir -p dist/data-deletion
          cp dist/data-deletion.html dist/data-deletion/index.html

      # Vercel previews every branch push by default, including this
      # generated gh-pages branch. That branch holds only build output (no
      # package.json), so Vercel's install step fails there and paints the
      # repo's Deployments panel with a red ❌ Preview entry. Shipping a
      # branch-level vercel.json that disables deployments for this branch
      # keeps the panel green without touching the real site.
      - name: Skip Vercel previews for this generated branch
        run: printf '%s\n' '{"git":{"deploymentEnabled":false}}' > dist/vercel.json

      # Publish to the gh-pages branch — the repo's Pages site is served from
      # this branch ("Deploy from a branch" source), which GitHub auto-builds
      # on every push. This path is not subject to the github-pages
      # environment protection rules that block native Actions deploys.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Pages deploy: ${{ github.sha }}"
