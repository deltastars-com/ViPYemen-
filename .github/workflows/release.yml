name: "Build & Release ViP Yemen"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build PWA and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run icons

      - name: Typecheck
        run: bun run typecheck

      - name: Build PWA
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp -r dist release/web-pwa
          zip -r release/vip-yemen-web-pwa-${{ github.ref_name }}.zip release/web-pwa
          zip -r release/vip-yemen-source-${{ github.ref_name }}.zip src index.html package.json bun.lock vite.config.ts capacitor.config.ts convex.json public scripts android ios .github
          cp PRIVACY-POLICY.md PRIVACY-POLICY-APP.md PUBLISHING-GUIDE.md RELEASE-GUIDE.md OPERATIONS-GUIDE.md README.md store-listing.json release/

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ViP Yemen ${{ github.ref_name }}
          body: |
            ## ViP Yemen — الإصدار ${{ github.ref_name }}

            ### المحتويات
            - **تطبيق الويب (PWA)**: مجلد `web-pwa` جاهز للاستضافة — يعمل بدون إنترنت
            - **الكود المصدري الكامل**: الواجهة + الباك إند (Convex) + مشروعي Android/iOS (Capacitor)
            - **وثائق النشر**: دليل Google Play وApp Store وسياسة الخصوصية
            - **APK/AAB**: تُرفق تلقائياً أدناه — موقّعة بشهادة الإصدار عند توفر التوقيع، وإلا نسخة مثبّتة موقّعة تشغيلياً
          files: |
            release/*.zip
            release/*.md
          draft: false
          prerelease: false

  build-android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run icons

      - name: Build web
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release keystore (if available)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > android/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK + AAB
        if: steps.keystore.outputs.mode == 'signed'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Build installable APK + AAB (debug-signed)
        if: steps.keystore.outputs.mode == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon
          mkdir -p app/build/outputs/apk/release app/build/outputs/bundle/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk
          cp app/build/outputs/bundle/debug/app-debug.aab app/build/outputs/bundle/release/vip-yemen-android-${{ github.ref_name }}.aab

      - name: Upload APK/AAB to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}