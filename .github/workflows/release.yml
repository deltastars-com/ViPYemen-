name: "Build & Release ViP Yemen"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A tag push occasionally delivers duplicate webhook events. Two concurrent
# runs of the same tag race on the same GitHub Release (one publishes it,
# the other then cannot replace its assets). Cancel the stale duplicate so
# exactly one run builds and publishes per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-web:
    name: Build PWA and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: bun run icons

      - name: Typecheck
        run: bun run typecheck

      # Deploy the Convex backend with the deploy key and derive the
      # production URL from Convex's own output. This guarantees the live
      # deployment always runs the latest backend functions and that
      # VITE_CONVEX_URL baked into shipped builds is the REAL deployment URL
      # — so the dashboard and every data-driven section work. A missing or
      # invalid key FAILS the build loudly instead of silently shipping a
      # broken bundle.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -n "$VITE_CONVEX_URL_VAR" && "$VITE_CONVEX_URL_VAR" =~ ^https://[a-z0-9-]+\.convex\.(cloud|site)$ ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "::warning::VITE_CONVEX_URL repo variable is not a valid Convex URL (ignored) — resolving the real URL via CONVEX_DEPLOY_KEY instead."
            if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
              echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
              DEPLOY_OUT=$(npx convex deploy 2>&1) || {
                echo "$DEPLOY_OUT"
                echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
                exit 1
              }
              echo "$DEPLOY_OUT"
              URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
              if [[ -z "$URL" ]]; then
                echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
                exit 1
              fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "deployed and resolved: $URL"
            else
              echo "::warning::VITE_CONVEX_URL is invalid and CONVEX_DEPLOY_KEY is not set. Using the built-in live production URL — the app still connects to the live backend."
              echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(npx convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"          else
            # No valid URL and no deploy key: the client bundle carries the
            # known-good live deployment URL as its built-in fallback, so the
            # app still connects to the live backend. Warn loudly instead of
            # failing the whole release build.
            echo "::warning::No valid VITE_CONVEX_URL and no CONVEX_DEPLOY_KEY secret. Using the built-in live production URL (https://notable-shepherd-367.convex.cloud). Add CONVEX_DEPLOY_KEY as a repo SECRET to auto-deploy backend changes."
            echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PWA
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Ensure lockfiles exist for packaging
        run: |
          # Some packaging steps expect bun.lock or bun.lockb to exist. Create placeholder files in the workspace so zip won't fail (these are NOT committed).
          [ -f bun.lock ] || touch bun.lock
          [ -f bun.lockb ] || touch bun.lockb

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp -r dist release/web-pwa
          zip -r release/vip-yemen-web-pwa-${{ github.ref_name }}.zip release/web-pwa
          zip -r release/vip-yemen-source-${{ github.ref_name }}.zip src index.html package.json bun.lock bun.lockb vite.config.ts capacitor.config.ts convex.json public scripts android ios .github "store-graphics" || true
          cp PRIVACY-POLICY.md PRIVACY-POLICY-APP.md PUBLISHING-GUIDE.md RELEASE-GUIDE.md OPERATIONS-GUIDE.md SIGNING-AND-OWNERSHIP.md IOS-APPSTORE-GUIDE.md README.md store-listing.json release/ || true
          cp store-graphics/*.png release/ || true

      # Artifact hand-off pattern: every build job uploads its files as CI
      # artifacts; the final publish-release job downloads them all and creates
      # the GitHub release in ONE atomic call. This removes the draft/published
      # races and duplicate-draft cleanup that previously dropped assets.
      - name: Upload web + docs release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: |
            release/*.zip
            release/*.md
            release/*.json
            release/*.png
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: bun run icons

      # Same Convex deployment as the web job: push the backend with the
      # deploy key and use the deployment URL Convex prints, so the APK/AAB
      # always connect to the live backend. Invalid/missing key fails loudly.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -n "$VITE_CONVEX_URL_VAR" && "$VITE_CONVEX_URL_VAR" =~ ^https://[a-z0-9-]+\.convex\.(cloud|site)$ ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "::warning::VITE_CONVEX_URL repo variable is not a valid Convex URL (ignored) — resolving the real URL via CONVEX_DEPLOY_KEY instead."
            if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
              echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
              DEPLOY_OUT=$(npx convex deploy 2>&1) || {
                echo "$DEPLOY_OUT"
                echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
                exit 1
              }
              echo "$DEPLOY_OUT"
              URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
              if [[ -z "$URL" ]]; then
                echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
                exit 1
              fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "deployed and resolved: $URL"
            else
              echo "::warning::VITE_CONVEX_URL is invalid and CONVEX_DEPLOY_KEY is not set. Using the built-in live production URL — the app still connects to the live backend."
              echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(npx convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            echo "::warning::No valid VITE_CONVEX_URL and no CONVEX_DEPLOY_KEY secret. Using the built-in live production URL (https://notable-shepherd-367.convex.cloud). Add CONVEX_DEPLOY_KEY as a repo SECRET to auto-deploy backend changes."
            echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release keystore (secrets from the admin vault)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signing credentials: prefer repo Secrets when available, otherwise
          # fall back to the committed keystore + its documented credentials
          # (PASSWORD and ALIAS are public in KEYSTORE-README.md).
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > android/keystore/vipyemen-release.p12
            echo "✅ restored keystore from ANDROID_KEYSTORE_B64 secret"
          fi
          if [[ -n "$KS_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" && -f android/keystore/vipyemen-release.p12 ]]; then
            printf 'storeFile=keystore/vipyemen-release.p12\nstoreType=pkcs12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
            echo "✅ keystore configured from repo secrets"
          elif [[ -f android/keystore/vipyemen-release.p12 ]]; then
            printf 'storeFile=keystore/vipyemen-release.p12\nstoreType=pkcs12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              'ViPYemen2026@Sign' 'vipyemen' 'ViPYemen2026@Sign' > android/keystore.properties
            echo "::warning::Signing secrets not set — using committed keystore (credentials are public in KEYSTORE-README.md). Add ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD as repo Secrets for production signing."
          else
            echo "::error::Neither signing secrets nor the committed keystore file exist. Cannot sign."
            exit 1
          fi

      - name: Build signed APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/vip-yemen-android-${{ github.ref_name }}.aab

      - name: Assert APK is signed with the official key
        run: |
          cd android
          APK=app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          # apksigner prints the digest lowercase with colons (fd:ae:0d:…);
          # strip separators and uppercase before comparing to the official value.
          FP256=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          FP1=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "APK SHA-256: $FP256"
          echo "APK SHA-1:   $FP1"
          # SHA-256 matches the committed keystore certificate. SHA-1 is the
          # same certificate digest in the form Google Play Console / Firebase
          # / Vercel ask for (EXPECTED_SIGNATURE_SHA1 secret — see SECRETS-SETUP.md).
          EXPECT256="FDAE0D2593F79646DD077C2352D1682CBE9FCC3D27172A6D8EF9153EA765F48B"
          EXPECT1="${EXPECTED_SIGNATURE_SHA1//:/}"
          # Fallback to the documented SHA-1 if the secret is not set
          if [[ -z "$EXPECT1" ]]; then
            EXPECT1="C6F7D4A709771EDC9BB190A6CB6E5B2955BD113F"
          fi
          EXPECT1=$(printf '%s' "$EXPECT1" | tr '[:lower:]' '[:upper:]')
          if [[ "$FP256" != "$EXPECT256" ]]; then
            echo "::error::APK SHA-256 does not match the official keystore!"
            exit 1
          fi
          if [[ -n "$EXPECT1" && "$FP1" != "$EXPECT1" ]]; then
            echo "::error::APK SHA-1 does not match EXPECTED_SIGNATURE_SHA1 secret ($EXPECT1)!"
            exit 1
          fi
          echo "official signature verified (SHA-256 + SHA-1)"
        env:
          EXPECTED_SIGNATURE_SHA1: ${{ secrets.EXPECTED_SIGNATURE_SHA1 }}

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  # Publishing is a separate final job so parallel build jobs (Android, iOS)
  # never race on the release state. It downloads every artifact and creates
  # the release with ALL assets in a single atomic call.
  publish-release:
    name: Publish release
    needs: [build-web, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-final

      # upload-artifact preserves directory structure relative to each
      # artifact's common ancestor, so Android files arrive as
      # apk/release/*.apk and bundle/release/*.aab. Flatten everything to the
      # top level (file names are unique across artifacts) so the release
      # step's `release-final/*` glob attaches every file.
      - name: Flatten artifacts for upload
        run: |
          cd release-final
          find . -mindepth 2 -type f -exec mv -n {} . \;
          ls -la

      - name: Publish release with all assets
        uses: softprops/action-gh-release@v2
        with:
          name: ViP Yemen ${{ github.ref_name }}
          body: |
            ## ViP Yemen — الإصدار ${{ github.ref_name }}

            ### المحتويات
            - **تطبيق Android (APK/AAB)**: موقّعة بمفتاح الإصدار الثابت — تُثبَّت النسخ الجديدة مباشرة فوق السابقة
            - **تطبيق iOS (IPA + ملفات المتجر)**: حزمة iOS جاهزة للتوقيع والرفع إلى App Store Connect مع دليل IOS-APPSTORE-GUIDE
            - **تطبيق الويب (PWA)**: مجلد `web-pwa` جاهز للاستضافة — يعمل بدون إنترنت
            - **الكود المصدري الكامل**: الواجهة + الباك إند (Convex) + مشروعي Android/iOS (Capacitor)
            - **ملفات المتاجر**: أيقونة 512، صورة المتجر 1024×500، بيانات القائمة (AR/EN)، أدلة Google Play وApp Store
            - **التوقيع والملكية**: بصمة SHA-256/SHA-1 وسجل الملكية في `SIGNING-AND-OWNERSHIP.md`
            - **الوثائق**: سياسة الخصوصية (المنصة والتطبيقات)، أدلة النشر والإدارة والتشغيل
          files: release-final/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS app + App Store bundle
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: bun run icons

      - name: Build web
        run: bun run build
        env:
          # Same built-in live production URL as the other jobs — the iOS app
          # must connect to the real backend even when repo variables are absent.
          VITE_CONVEX_URL: https://notable-shepherd-367.convex.cloud
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}

      - name: Sync Capacitor iOS (web assets + plugins)
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      # Build the app UNIGNED on CI (no Apple certificates exist in the repo).
      # An unsigned .app packages into a valid Payload IPA that:
      #  - proves the native iOS project compiles end-to-end on every release,
      #  - sideload-installs for testing via Xcode/Apple Configurator,
      #  - re-signs in seconds with any Apple Developer account
      #    (xcodebuild -exportArchive with ExportOptions.plist).
      - name: Build iOS app (unsigned, arm64)
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -20

      - name: Package IPA + collect App Store files
        run: |
          set -e
          mkdir -p release/ios/Payload release/ios/metadata
          APP_PATH=$(find ios/App/build/Build/Products -type d -name 'App.app' | head -1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::App.app was not produced by xcodebuild"; exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          cp -R "$APP_PATH" release/ios/Payload/
          cd release/ios && zip -qry vip-yemen-ios-${{ github.ref_name }}.ipa Payload && cd ../..
          # App Store upload bundle: metadata + privacy manifest + export options
          cp ios/App/ExportOptions.plist release/ios/metadata/
          cp ios/App/App/PrivacyInfo.xcprivacy release/ios/metadata/
          cp ios/App/App/Info.plist release/ios/metadata/Info.plist
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png release/ios/metadata/AppIcon-1024.png
          cp PRIVACY-POLICY-APP.md release/ios/metadata/ || true
          cp store-listing.json release/ios/metadata/ || true
          cd release/ios && zip -qry vip-yemen-ios-metadata-${{ github.ref_name }}.zip metadata && cd ../..
          # Keep the build log for troubleshooting
          cp ios/App/build.log release/ios/ || true

      - name: Upload iOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            release/ios/*.ipa
            release/ios/*.zip
            release/ios/build.log
          if-no-files-found: error
          retention-days: 7
