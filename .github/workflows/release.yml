name: "Build & Release ViP Yemen"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A tag push occasionally delivers duplicate webhook events. Two concurrent
# runs of the same tag race on the same GitHub Release (one publishes it,
# the other then cannot replace its assets). Cancel the stale duplicate so
# exactly one run builds and publishes per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # One-time release preparation: create the GitHub Release as a DRAFT
  # before any build runs. Each build job then attaches its platform assets
  # DIRECTLY with `gh release upload` — no actions/upload-artifact hop — so
  # the release pipeline can never be blocked by the account's Actions
  # artifact storage quota. The final publish job flips the draft to a
  # public release only after verifying EVERY platform asset is attached.
  prepare-release:
    name: Prepare GitHub release (draft)
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release (idempotent)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "Release $TAG already exists — assets will be re-attached with --clobber."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "ViP Yemen $TAG" \
              --notes "يجري الآن بناء جميع المنصات (Android · iOS · Web) — يُنشر هذا الإصدار تلقائياً بعد اكتمال البناء والتحقق من كامل الملفات."
          fi

  build-web:
    name: Build PWA and publish release
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      # Deploy the Convex backend with the deploy key and derive the
      # production URL from Convex's own output. This guarantees the live
      # deployment always runs the latest backend functions and that
      # VITE_CONVEX_URL baked into shipped builds is the REAL deployment URL
      # — so the dashboard and every data-driven section work. A missing or
      # invalid key FAILS the build loudly instead of silently shipping a
      # broken bundle.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GEMINI_KEY_SECRET: ${{ secrets.VITE_GEMINI_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          # Keep the Gemini key in the Convex SERVER environment (never in the
          # client bundle) — synced from the repo secret on every backend push.
          if [[ -n "$GEMINI_KEY_SECRET" && -n "$CONVEX_DEPLOY_KEY" ]]; then
            ./node_modules/.bin/convex env set GEMINI_KEY "$GEMINI_KEY_SECRET" >/dev/null 2>&1 && \
              echo "GEMINI_KEY synced to Convex server env" || \
              echo "::warning::Could not sync GEMINI_KEY to Convex env — AI falls back to the free engine until the key is set in the Convex dashboard."
          fi
          if [[ -n "$VITE_CONVEX_URL_VAR" && "$VITE_CONVEX_URL_VAR" =~ ^https://[a-z0-9-]+\.convex\.(cloud|site)$ ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "::warning::VITE_CONVEX_URL repo variable is not a valid Convex URL (ignored) — resolving the real URL via CONVEX_DEPLOY_KEY instead."
            if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
              echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
              DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
                echo "$DEPLOY_OUT"
                echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
                exit 1
              }
              echo "$DEPLOY_OUT"
              URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
              if [[ -z "$URL" ]]; then
                echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
                exit 1
              fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "deployed and resolved: $URL"
            else
              echo "::warning::VITE_CONVEX_URL is invalid and CONVEX_DEPLOY_KEY is not set. Using the built-in live production URL — the app still connects to the live backend."
              echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            # No valid URL and no deploy key: the client bundle carries the
            # known-good live deployment URL as its built-in fallback, so the
            # app still connects to the live backend. Warn loudly instead of
            # failing the whole release build.
            echo "::warning::No valid VITE_CONVEX_URL and no CONVEX_DEPLOY_KEY secret. Using the built-in live production URL (https://notable-shepherd-367.convex.cloud). Add CONVEX_DEPLOY_KEY as a repo SECRET to auto-deploy backend changes."
            echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PWA
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Ensure lockfiles exist for packaging
        run: |
          # Some packaging steps expect bun.lock or bun.lockb to exist. Create placeholder files in the workspace so zip won't fail (these are NOT committed).
          [ -f bun.lock ] || touch bun.lock
          [ -f bun.lockb ] || touch bun.lockb

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp -r dist release/web-pwa
          zip -r release/vip-yemen-web-pwa-${{ github.ref_name }}.zip release/web-pwa
          zip -r release/vip-yemen-source-${{ github.ref_name }}.zip src index.html package.json bun.lock bun.lockb vite.config.ts capacitor.config.ts convex.json public scripts android ios .github "store-graphics" || true
          cp PRIVACY-POLICY.md PRIVACY-POLICY-APP.md PUBLISHING-GUIDE.md RELEASE-GUIDE.md OPERATIONS-GUIDE.md SIGNING-AND-OWNERSHIP.md IOS-APPSTORE-GUIDE.md README.md CHANGELOG.md store-listing.json release/ || true
          cp store-graphics/*.png release/ || true

      # Assets go straight from this job onto the GitHub Release (no CI
      # artifact storage involved) — see prepare-release above.
      - name: Attach web + docs assets to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          cd release
          shopt -s nullglob
          files=( *.zip *.md *.json *.png )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No web release files were produced"
            exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  build-android:
    name: Build signed APK + AAB
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          # Ubuntu runners have Android SDK pre-installed
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          # Accept all licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          # Install only the build tools we need (no deprecated 'tools' package)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      # Same Convex deployment as the web job: push the backend with the
      # deploy key and use the deployment URL Convex prints, so the APK/AAB
      # always connect to the live backend. Invalid/missing key fails loudly.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GEMINI_KEY_SECRET: ${{ secrets.VITE_GEMINI_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          # Keep the Gemini key in the Convex SERVER environment (never in the
          # client bundle) — synced from the repo secret on every backend push.
          if [[ -n "$GEMINI_KEY_SECRET" && -n "$CONVEX_DEPLOY_KEY" ]]; then
            ./node_modules/.bin/convex env set GEMINI_KEY "$GEMINI_KEY_SECRET" >/dev/null 2>&1 && \
              echo "GEMINI_KEY synced to Convex server env" || \
              echo "::warning::Could not sync GEMINI_KEY to Convex env — AI falls back to the free engine until the key is set in the Convex dashboard."
          fi
          if [[ -n "$VITE_CONVEX_URL_VAR" && "$VITE_CONVEX_URL_VAR" =~ ^https://[a-z0-9-]+\.convex\.(cloud|site)$ ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "::warning::VITE_CONVEX_URL repo variable is not a valid Convex URL (ignored) — resolving the real URL via CONVEX_DEPLOY_KEY instead."
            if [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
              echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
              DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
                echo "$DEPLOY_OUT"
                echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
                exit 1
              }
              echo "$DEPLOY_OUT"
              URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
              if [[ -z "$URL" ]]; then
                echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
                exit 1
              fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "deployed and resolved: $URL"
            else
              echo "::warning::VITE_CONVEX_URL is invalid and CONVEX_DEPLOY_KEY is not set. Using the built-in live production URL — the app still connects to the live backend."
              echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(./node_modules/.bin/convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            echo "::warning::No valid VITE_CONVEX_URL and no CONVEX_DEPLOY_KEY secret. Using the built-in live production URL (https://notable-shepherd-367.convex.cloud). Add CONVEX_DEPLOY_KEY as a repo SECRET to auto-deploy backend changes."
            echo "url=https://notable-shepherd-367.convex.cloud" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Configure release keystore (secrets from the admin vault)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signing credentials: prefer repo Secrets when available, otherwise
          # fall back to the committed keystore + its documented credentials
          # (PASSWORD and ALIAS are public in KEYSTORE-README.md).
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > android/keystore/vipyemen-release.p12
            echo "✅ restored keystore from ANDROID_KEYSTORE_B64 secret"
          fi
          if [[ -n "$KS_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" && -f android/keystore/vipyemen-release.p12 ]]; then
            printf 'storeFile=keystore/vipyemen-release.p12\nstoreType=pkcs12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
            echo "✅ keystore configured from repo secrets"
          elif [[ -f android/keystore/vipyemen-release.p12 ]]; then
            printf 'storeFile=keystore/vipyemen-release.p12\nstoreType=pkcs12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              'ViPYemen2026@Sign' 'vipyemen' 'ViPYemen2026@Sign' > android/keystore.properties
            echo "::warning::Signing secrets not set — using committed keystore (credentials are public in KEYSTORE-README.md). Add ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD as repo Secrets for production signing."
          else
            echo "::error::Neither signing secrets nor the committed keystore file exist. Cannot sign."
            exit 1
          fi

      - name: Build signed APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/vip-yemen-android-${{ github.ref_name }}.aab

      - name: Assert APK is signed with the official key
        run: |
          cd android
          APK=app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          # apksigner prints the digest lowercase with colons (fd:ae:0d:…);
          # strip separators and uppercase before comparing to the official value.
          FP256=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          FP1=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "APK SHA-256: $FP256"
          echo "APK SHA-1:   $FP1"
          # SHA-256 matches the committed keystore certificate. SHA-1 is the
          # same certificate digest in the form Google Play Console / Firebase
          # / Vercel ask for (EXPECTED_SIGNATURE_SHA1 secret — see SECRETS-SETUP.md).
          EXPECT256="FDAE0D2593F79646DD077C2352D1682CBE9FCC3D27172A6D8EF9153EA765F48B"
          EXPECT1="${EXPECTED_SIGNATURE_SHA1//:/}"
          # Fallback to the documented SHA-1 if the secret is not set
          if [[ -z "$EXPECT1" ]]; then
            EXPECT1="C6F7D4A709771EDC9BB190A6CB6E5B2955BD113F"
          fi
          EXPECT1=$(printf '%s' "$EXPECT1" | tr '[:lower:]' '[:upper:]')
          if [[ "$FP256" != "$EXPECT256" ]]; then
            echo "::error::APK SHA-256 does not match the official keystore!"
            exit 1
          fi
          if [[ -n "$EXPECT1" && "$FP1" != "$EXPECT1" ]]; then
            echo "::error::APK SHA-1 does not match EXPECTED_SIGNATURE_SHA1 secret ($EXPECT1)!"
            exit 1
          fi
          echo "official signature verified (SHA-256 + SHA-1)"
        env:
          EXPECTED_SIGNATURE_SHA1: ${{ secrets.EXPECTED_SIGNATURE_SHA1 }}

      - name: Attach APK + AAB to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          APK="android/app/build/outputs/apk/release/vip-yemen-android-${TAG}.apk"
          AAB="android/app/build/outputs/bundle/release/vip-yemen-android-${TAG}.aab"
          if [ ! -f "$APK" ] || [ ! -f "$AAB" ]; then
            echo "::error::APK/AAB missing — cannot attach to the release"
            exit 1
          fi
          ls -la "$APK" "$AAB"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$APK" "$AAB"

  # Final gate: every platform asset MUST be present on the release before it
  # is flipped from draft to public. Uploads happen directly from the build
  # jobs via `gh release upload` (no CI artifact storage), so a full Actions
  # artifact-storage quota can never block a release again.
  publish-release:
    name: Publish release
    needs: [prepare-release, build-web, build-android, build-ios]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Verify every platform asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$NAMES"
          fail() { echo "::error::$1"; exit 1; }
          echo "$NAMES" | grep -qE '\.apk$'          || fail "APK missing from the release"
          echo "$NAMES" | grep -qE '\.aab$'          || fail "AAB missing from the release"
          echo "$NAMES" | grep -qE '\.ipa$'          || fail "IPA missing from the release"
          echo "$NAMES" | grep -qE 'web-pwa.*\.zip$' || fail "PWA zip missing from the release"
          echo "$NAMES" | grep -qE 'source.*\.zip$'  || fail "source zip missing from the release"
          echo "$NAMES" | grep -qE '\.md$'           || fail "documentation files missing from the release"
          echo "✔ all platform assets present ($TAG)"

      - name: Publish release with full notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          {
            echo "## ViP Yemen — الإصدار $TAG"
            echo
            echo "### المحتويات"
            echo '- **تطبيق Android (APK/AAB)**: موقّعة بمفتاح الإصدار الثابت — تُثبَّت النسخ الجديدة مباشرة فوق السابقة'
            echo '- **تطبيق iOS (IPA + ملفات المتجر)**: حزمة iOS جاهزة للتوقيع والرفع إلى App Store Connect مع دليل IOS-APPSTORE-GUIDE'
            echo '- **تطبيق الويب (PWA)**: مجلد web-pwa جاهز للاستضافة — يعمل بدون إنترنت'
            echo '- **الكود المصدري الكامل**: الواجهة + الباك إند (Convex) + مشروعي Android/iOS (Capacitor)'
            echo '- **ملفات المتجر**: أيقونة 512، صورة المتجر 1024×500، بيانات القائمة (AR/EN)، أدلة Google Play وApp Store'
            echo '- **التوقيع والملكية**: بصمة SHA-256/SHA-1 وسجل الملكية في SIGNING-AND-OWNERSHIP.md'
            echo '- **الوثائق**: سياسة الخصوصية (المنصة والتطبيقات)، أدلة النشر والإدارة والتشغيل'
          } > /tmp/release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --title "ViP Yemen $TAG" \
            --notes-file /tmp/release-notes.md
          echo "✔ release published: $TAG"

  build-ios:
    name: Build iOS app + App Store bundle
    needs: [prepare-release]
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      - name: Build web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          # Same built-in live production URL as the other jobs — the iOS app
          # must connect to the real backend even when repo variables are absent.
          VITE_CONVEX_URL: https://notable-shepherd-367.convex.cloud
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor iOS (web assets + plugins)
        run: ./node_modules/.bin/cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      # Build the app UNIGNED on CI (no Apple certificates exist in the repo).
      # An unsigned .app packages into a valid Payload IPA that:
      #  - proves the native iOS project compiles end-to-end on every release,
      #  - sideload-installs for testing via Xcode/Apple Configurator,
      #  - re-signs in seconds with any Apple Developer account
      #    (xcodebuild -exportArchive with ExportOptions.plist).
      - name: Build iOS app (unsigned, arm64)
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -20

      - name: Package IPA + collect App Store files
        run: |
          set -e
          mkdir -p release/ios/Payload release/ios/metadata
          APP_PATH=$(find ios/App/build/Build/Products -type d -name 'App.app' | head -1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::App.app was not produced by xcodebuild"; exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          cp -R "$APP_PATH" release/ios/Payload/
          cd release/ios && zip -qry vip-yemen-ios-${{ github.ref_name }}.ipa Payload && cd ../..
          # App Store upload bundle: metadata + privacy manifest + export options
          cp ios/App/ExportOptions.plist release/ios/metadata/
          cp ios/App/App/PrivacyInfo.xcprivacy release/ios/metadata/
          cp ios/App/App/Info.plist release/ios/metadata/Info.plist
          cp ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png release/ios/metadata/AppIcon-1024.png
          cp PRIVACY-POLICY-APP.md release/ios/metadata/ || true
          cp store-listing.json release/ios/metadata/ || true
          cd release/ios && zip -qry vip-yemen-ios-metadata-${{ github.ref_name }}.zip metadata && cd ../..
          # Keep the build log for troubleshooting
          cp ios/App/build.log release/ios/ || true

      - name: Attach IPA + metadata to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          shopt -s nullglob
          files=( release/ios/*.ipa release/ios/*.zip release/ios/build.log )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No iOS release files were produced"
            exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  # ── Signed iOS build (App Store Connect ready) ──────────────────────────
  # OPTIONAL extra pass. Runs only when the repository VARIABLE
  # APPLE_SIGNING_ENABLED is "true" and these secrets are present:
  #   APPLE_CERTIFICATE_B64           – base64 of the .p12 distribution cert
  #   APPLE_CERTIFICATE_PASSWORD      – its password
  #   APPLE_PROVISIONING_PROFILE_B64  – base64 of the .mobileprovision
  #   APPLE_TEAM_ID                   – 10-character Apple Team ID
  # When disabled (default) nothing changes: the unsigned IPA built by
  # build-ios stays the release artifact, so missing Apple credentials can
  # never break a release. See SECRETS-SETUP.md for the one-time setup.
  build-ios-signed:
    name: Build SIGNED iOS (App Store Connect)
    needs: [prepare-release]
    if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      - name: Build web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_CONVEX_URL: https://notable-shepherd-367.convex.cloud
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor iOS
        run: ./node_modules/.bin/cap sync ios

      - name: Import Apple distribution certificate + provisioning profile
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_B64" ] || [ -z "$CERT_PASS" ] || [ -z "$PROFILE_B64" ]; then
            echo "::error::APPLE_SIGNING_ENABLED=true but the Apple secrets are missing. Set APPLE_CERTIFICATE_B64 / APPLE_CERTIFICATE_PASSWORD / APPLE_PROVISIONING_PROFILE_B64 / APPLE_TEAM_ID (see SECRETS-SETUP.md)."
            exit 1
          fi
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/vipyemen.mobileprovision
          security find-identity -v -p codesigning

      - name: Archive + export the signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$TEAM_ID" ] || { echo "::error::APPLE_TEAM_ID is required for signing"; exit 1; }
          PROFILE_NAME=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/vipyemen.mobileprovision | plutil -extract Name raw -o - -)
          echo "Provisioning profile: $PROFILE_NAME"
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.vip.yemen</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -archivePath build/App.xcarchive archive | tail -20
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath build/export | tail -20
          ls -la build/export

      - name: Attach the signed IPA to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          IPA=$(ls ios/App/build/export/*.ipa | head -1)
          mkdir -p release/ios-signed
          cp "$IPA" "release/ios-signed/vip-yemen-ios-signed-${TAG}.ipa"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "release/ios-signed/vip-yemen-ios-signed-${TAG}.ipa"
          echo "✔ signed IPA attached (App Store Connect ready)"
