name: "Build & Release ViP Yemen"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build PWA and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: bun run icons

      - name: Typecheck
        run: bun run typecheck

      # Deploy the Convex backend with the deploy key and derive the
      # production URL from Convex's own output. This guarantees the live
      # deployment always runs the latest backend functions and that
      # VITE_CONVEX_URL baked into shipped builds is the REAL deployment URL
      # — so the dashboard and every data-driven section work. A missing or
      # invalid key FAILS the build loudly instead of silently shipping a
      # broken bundle.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(npx convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            echo "::error::Neither VITE_CONVEX_URL (repo variable) nor CONVEX_DEPLOY_KEY (secret) is set. The dashboard and sections cannot work without a backend URL. Set CONVEX_DEPLOY_KEY and re-run."
            exit 1
          fi

      - name: Build PWA
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Ensure lockfiles exist for packaging
        run: |
          # Some packaging steps expect bun.lock or bun.lockb to exist. Create placeholder files in the workspace so zip won't fail (these are NOT committed).
          [ -f bun.lock ] || touch bun.lock
          [ -f bun.lockb ] || touch bun.lockb

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp -r dist release/web-pwa
          zip -r release/vip-yemen-web-pwa-${{ github.ref_name }}.zip release/web-pwa
          zip -r release/vip-yemen-source-${{ github.ref_name }}.zip src index.html package.json bun.lock bun.lockb vite.config.ts capacitor.config.ts convex.json public scripts android ios .github "store-graphics" || true
          cp PRIVACY-POLICY.md PRIVACY-POLICY-APP.md PUBLISHING-GUIDE.md RELEASE-GUIDE.md OPERATIONS-GUIDE.md SIGNING-AND-OWNERSHIP.md README.md store-listing.json release/ || true
          cp store-graphics/*.png release/ || true

      - name: Create draft release with web + docs artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ViP Yemen ${{ github.ref_name }}
          body: |
            ## ViP Yemen — الإصدار ${{ github.ref_name }}

            ### المحتويات
            - **تطبيق الويب (PWA)**: مجلد `web-pwa` جاهز للاستضافة — يعمل بدون إنترنت
            - **الكود المصدري الكامل**: الواجهة + الباك إند (Convex) + مشروعي Android/iOS (Capacitor)
            - **APK/AAB**: موقّعة بمفتاح إصدار ثابت — تُثبَّت النسخ الجديدة مباشرة فوق السابقة بدون حذف
            - **ملفات المتاجر**: أيقونة 512، صورة المتجر 1024×500، بيانات القائمة (AR/EN)، أدلة الرفع Google Play وApp Store
            - **التوقيع والملكية**: ملف المفتاح (PKCS12)، بيانات الشهادة، بصمة SHA-256، وسجل الملكية في `SIGNING-AND-OWNERSHIP.md`
            - **الوثائق**: سياسة الخصوصية (المنصة والتطبيقات)، دليل الإدارة والتشغيل، الكود المصدري الكامل
          files: |
            release/*.zip
            release/*.md
            release/*.json
            release/*.png
          draft: true
          prerelease: false

  build-android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: bun run icons

      # Same Convex deployment as the web job: push the backend with the
      # deploy key and use the deployment URL Convex prints, so the APK/AAB
      # always connect to the live backend. Invalid/missing key fails loudly.
      - name: Deploy Convex backend and resolve URL
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL_VAR: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -n "$VITE_CONVEX_URL_VAR" ]]; then
            echo "url=$VITE_CONVEX_URL_VAR" >> "$GITHUB_OUTPUT"
            echo "using repo variable VITE_CONVEX_URL"
          elif [[ -n "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Deploying Convex backend with CONVEX_DEPLOY_KEY..."
            DEPLOY_OUT=$(npx convex deploy 2>&1) || {
              echo "$DEPLOY_OUT"
              echo "::error::Convex deploy failed — CONVEX_DEPLOY_KEY is invalid or the deployment no longer exists. Get a fresh key from your Convex dashboard (Project Settings → Deploy Keys) and update the repo secret, then re-run."
              exit 1
            }
            echo "$DEPLOY_OUT"
            URL=$(printf '%s' "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.(site|cloud)' | head -1 || true)
            if [[ -z "$URL" ]]; then
              echo "::error::Convex deploy succeeded but no deployment URL was found in its output."
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "deployed and resolved: $URL"
          else
            echo "::error::Neither VITE_CONVEX_URL (repo variable) nor CONVEX_DEPLOY_KEY (secret) is set. Set CONVEX_DEPLOY_KEY and re-run."
            exit 1
          fi

      - name: Build web
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release keystore (secrets override the committed one)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The repo ships a stable keystore (android/keystore.properties +
          # android/keystore/vipyemen-release.p12), so EVERY build is signed
          # with the SAME key and new versions install over old ones without
          # uninstalling. Repo secrets replace it when present.
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > android/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
          fi
          test -f android/keystore.properties && echo "keystore configured"

      - name: Build signed APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/vip-yemen-android-${{ github.ref_name }}.aab

      - name: Assert APK is signed with the official key
        run: |
          cd android
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          # apksigner prints the digest lowercase with colons (fd:ae:0d:…);
          # strip separators and uppercase before comparing to the official value.
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/vip-yemen-android-${{ github.ref_name }}.apk | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "APK SHA-256: $FP"
          EXPECT="FDAE0D2593F79646DD077C2352D1682CBE9FCC3D27172A6D8EF9153EA765F48B"
          if [[ "$FP" != "$EXPECT" ]]; then
            echo "::error::APK signature does not match the official keystore!"
            exit 1
          fi
          echo "official signature verified"

      - name: Upload APK/AAB to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/keystore.properties
            android/keystore/KEYSTORE-README.md
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.data.id,
              draft: false
            });
