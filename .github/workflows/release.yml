name: "Build & Release ViP Yemen"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build PWA and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run icons

      - name: Typecheck
        run: bun run typecheck

      - name: Build PWA
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp -r dist release/web-pwa
          zip -r release/vip-yemen-web-pwa-${{ github.ref_name }}.zip release/web-pwa
          zip -r release/vip-yemen-source-${{ github.ref_name }}.zip src index.html package.json bun.lock vite.config.ts capacitor.config.ts convex.json public scripts android ios .github store-graphics
          cp PRIVACY-POLICY.md PRIVACY-POLICY-APP.md PUBLISHING-GUIDE.md RELEASE-GUIDE.md OPERATIONS-GUIDE.md SIGNING-AND-OWNERSHIP.md README.md store-listing.json release/
          cp store-graphics/*.png release/

      - name: Create draft release with web + docs artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ViP Yemen ${{ github.ref_name }}
          body: |
            ## ViP Yemen — الإصدار ${{ github.ref_name }}

            ### المحتويات
            - **تطبيق الويب (PWA)**: مجلد `web-pwa` جاهز للاستضافة — يعمل بدون إنترنت
            - **الكود المصدري الكامل**: الواجهة + الباك إند (Convex) + مشروعي Android/iOS (Capacitor)
            - **APK/AAB**: موقّعة بمفتاح إصدار ثابت — تُثبَّت النسخ الجديدة مباشرة فوق السابقة بدون حذف
            - **ملفات المتاجر**: أيقونة 512، صورة المتجر 1024×500، بيانات القائمة (AR/EN)، أدلة الرفع Google Play وApp Store
            - **التوقيع والملكية**: ملف المفتاح (PKCS12)، بيانات الشهادة، بصمة SHA-256، وسجل الملكية في `SIGNING-AND-OWNERSHIP.md`
            - **الوثائق**: سياسة الخصوصية (المنصة والتطبيقات)، دليل الإدارة والتشغيل، الكود المصدري الكامل
          files: |
            release/*.zip
            release/*.md
            release/*.json
            release/*.png
          draft: true
          prerelease: false

  build-android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run icons

      - name: Build web
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release keystore (secrets override the committed one)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The repo ships a stable keystore (android/keystore.properties +
          # android/keystore/vipyemen-release.p12), so EVERY build is signed
          # with the SAME key and new versions install over old ones without
          # uninstalling. Repo secrets replace it when present.
          if [[ -n "$KS_B64" ]]; then
            echo "$KS_B64" | base64 -d > android/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
          fi
          test -f android/keystore.properties && echo "keystore configured"

      - name: Build signed APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK/AAB to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/keystore.properties
            android/keystore/README.md
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.data.id,
              draft: false
            });