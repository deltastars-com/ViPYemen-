name: Secret scan (حاجز الأسرار)

# يمنع تكرار تسريب التوكنات: يفشل البناء إذا وُجد سرّ مكتوب صريحاً في ملفات
# المستودع. الأسرار القديمة المعروفة والموسومة تتجاوز الفحص حتى تُبدَّل.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked files for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scan
        run: sh ./scripts/scan-secrets.sh
      - name: Telegram token rotation reminder
        run: |
          if grep -rl "legacy-leaked-secret-allowlisted" src/ 2>/dev/null | grep -q .; then
            echo "::warning title=توكن تلجرام القديم ما زال مستخدماً::بدّل التوكن من @BotFather وأضف TELEGRAM_BOT_TOKEN في متغيرات Convex — التوكن القديم مسرّب في تاريخ المستودع وهو معروف للعامة."
          fi
