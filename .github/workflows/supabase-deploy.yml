# Deploy Supabase migrations automatically on push to main.
# Requires: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID in repository secrets.
# If secrets are not configured, the workflow skips gracefully.

name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'backend/sql/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-deploy:
    name: Check & Deploy migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check if secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_PROJECT_ID }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✅ Supabase secrets detected — proceeding with migration deploy."
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "⚠️ SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID not configured — skipping."
            echo "Add these secrets in repository Settings → Secrets and variables → Actions."
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase link \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Generate TypeScript types
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p src/types
          supabase gen types typescript --local > src/types/supabase.ts 2>/dev/null || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit updated types (if changed)
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -f src/types/supabase.ts ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/types/supabase.ts
            git diff --cached --quiet || git commit -m "chore: update Supabase types [skip ci]" && git push || echo "No type changes to commit"
          fi
