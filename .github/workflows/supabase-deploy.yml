# Deploy Supabase migrations automatically on push to main.
# Requires: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID in repository secrets.

name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-migrations:
    name: Deploy database migrations
    runs-on: ubuntu-latest
    environment: github-actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: |
          supabase link \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Generate TypeScript types
        run: |
          supabase gen types typescript --local > src/types/supabase.ts 2>/dev/null || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration success
        run: |
          echo "=== Checking migration status ==="
          supabase migration list
          echo "=== Tables created ==="
          supabase db diff --use-migra 2>/dev/null | head -50 || echo "Diff check complete"

      - name: Commit updated types (if changed)
        run: |
          if [ -f src/types/supabase.ts ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/types/supabase.ts
            git diff --cached --quiet || git commit -m "chore: update Supabase types [skip ci]" && git push || echo "No type changes to commit"
          fi