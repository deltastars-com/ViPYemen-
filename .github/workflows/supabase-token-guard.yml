# حراسة صلاحية توكن Supabase (SUPABASE_ACCESS_TOKEN).
#
# توكنات Supabase (PATs) لا يمكن تمديدها أو تجديدها برمجياً — لا يوجد في
# Management API أي مسار لإصدار توكن جديد مكان القديم، لذلك لا يمكن لأي سير
# عمل أن «يجددها تلقائياً» بصدق. ما يمكن أتمتته فعلاً — وهو ما يفعله هذا
# الملف — التحقق الدوري الحقيقي من أن التوكن ما زال صالحاً، والتنبيه قبل
# انتهاء صلاحيته وبعدها، والإغلاق التلقائي فور تجديده.
#
# الإعداد (مرة واحدة):
#   Settings → Secrets and variables → Actions → Variables
#     SUPABASE_TOKEN_EXPIRES_ON = YYYY-MM-DD   (تاريخ انتهاء التوكن الحالي)
# إن لم يُضبط التاريخ، يبقى الفحص الأسبوعي يعمل ويُنبّه فقط عند رفض التوكن.

name: Supabase token guard (صلاحية التوكن)

on:
  schedule:
    - cron: '0 6 * * 1' # كل اثنين 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-token-guard
  cancel-in-progress: true

jobs:
  check:
    name: Check SUPABASE_ACCESS_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Verify the token against the Supabase Management API
        id: probe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN غير مضبوط في أسرار المستودع — لا شيء لأفحصه."
            echo "state=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/supabase.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects || echo 000)
          echo "HTTP $CODE"
          case "$CODE" in
            200) echo "state=ok" >> "$GITHUB_OUTPUT" ;;
            401|403) echo "state=expired" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=unknown" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Evaluate the remaining lifetime
        id: life
        env:
          EXPIRES_ON: ${{ vars.SUPABASE_TOKEN_EXPIRES_ON }}
        run: |
          set -uo pipefail
          if [ -z "${EXPIRES_ON:-}" ]; then
            echo "days=unset" >> "$GITHUB_OUTPUT"
            echo "::notice::لم يُضبط المتغير SUPABASE_TOKEN_EXPIRES_ON — سيُنبّه السير فقط عند رفض التوكن."
            exit 0
          fi
          if ! EXP_TS=$(date -u -d "$EXPIRES_ON" +%s 2>/dev/null); then
            echo "days=unset" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_TOKEN_EXPIRES_ON ليس تاريخاً صحيحاً (المتوقع YYYY-MM-DD)."
            exit 0
          fi
          DAYS=$(( (EXP_TS - $(date -u +%s)) / 86400 ))
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "الأيام المتبقية على انتهاء التوكن: $DAYS"

      - name: Open or update the reminder issue
        if: steps.probe.outputs.state == 'expired' || (steps.life.outputs.days != 'unset' && steps.life.outputs.days < 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.probe.outputs.state }}
          DAYS: ${{ steps.life.outputs.days }}
          EXPIRES_ON: ${{ vars.SUPABASE_TOKEN_EXPIRES_ON }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="🔑 توكن Supabase يحتاج تجديداً"
          BODY=$(cat <<EOF
          ## حالة \`SUPABASE_ACCESS_TOKEN\`

          | البند | القيمة |
          |---|---|
          | نتيجة الفحص الفعلي | \`$STATE\` |
          | تاريخ الانتهاء المضبوط | \`${EXPIRES_ON:-غير مضبوط}\` |
          | الأيام المتبقية | \`$DAYS\` |
          | آخر فحص | $(date -u '+%Y-%m-%d %H:%M UTC') |

          ### كيف يُجدَّد (دقيقتان)
          1. <https://supabase.com/dashboard/account/tokens> ← **Generate new token**.
          2. انسخ التوكن، ثم: **Settings → Secrets and variables → Actions** ←
             حدّث السر \`SUPABASE_ACCESS_TOKEN\`.
          3. حدّث المتغير \`SUPABASE_TOKEN_EXPIRES_ON\` بتاريخ الانتهاء الجديد (YYYY-MM-DD).
          4. أعد تشغيل هذا السير يدوياً (Run workflow) — يُغلق هذا التنبيه تلقائياً عند النجاح.

          > التوكنات في Supabase لا تُمدَّد برمجياً؛ هذا الفحص الدوري هو الأتمتة
          > الوحيدة المضمونة، ويغلق التنبيه تلقائياً فور صلاحية التوكن الجديد.
          > التفاصيل: \`SUPABASE-TOKEN-RENEWAL.md\`.
          EOF
          )
          NUM=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            echo "::notice::حُدِّث التنبيه القائم (#$NUM)."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Close the reminder once the token works again
        if: steps.probe.outputs.state == 'ok' && (steps.life.outputs.days == 'unset' || steps.life.outputs.days >= 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="🔑 توكن Supabase يحتاج تجديداً"
          NUM=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "✅ التوكن صالح الآن وصلاحيته كافية — يُغلق هذا التنبيه تلقائياً."
            gh issue close "$NUM" --repo "$REPO"
            echo "::notice::أُغلق التنبيه #$NUM تلقائياً."
          else
            echo "لا يوجد تنبيه مفتوح — التوكن سليم."
          fi
