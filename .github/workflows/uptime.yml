name: Uptime watchdog (continuity monitor)

# Free, proactive monitoring of every public channel the platform depends on.
# Runs every 6 hours and on demand. If any mirror or the backend stops
# answering it opens (or updates) a single GitHub issue — so an outage is
# reported within hours without any paid monitoring service, and the issue is
# closed automatically on the first successful sweep.
#
# The APK/AAB/iOS apps are self-contained (assets bundled inside the package,
# see the release workflow) — this watchdog exists so the WEB mirrors and the
# shared backend are always verified too.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-watchdog
  cancel-in-progress: true

jobs:
  probe:
    name: Probe mirrors + backend
    runs-on: ubuntu-latest
    steps:
      - name: Check every public channel
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_MIRROR_URLS: ${{ vars.EXTRA_MIRROR_URLS }}
        run: |
          set -uo pipefail
          FAILED=""
          check() {
            local name="$1" url="$2"
            local code attempt
            # محاولة مزدوجة + اتّباع التحويلات: نافذة النشر قد تُظهر 404/000
            # للحظات — لا نرفع إنذاراً كاذباً قبل إعادة الفحص.
            for attempt in 1 2; do
              code=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 25 "$url" 2>/dev/null || true)
              [ "$code" = "200" ] && break
              [ "$attempt" = "1" ] && sleep 15
            done
            printf '%-24s %s\n' "$name" "${code:-000}"
            # real newline ("\n" inside quotes stays literal and breaks printf)
            [ "$code" = "200" ] || FAILED="${FAILED}- **${name}** → HTTP ${code:-000} (${url})"$'\n'
          }

          check "Vercel mirror"   "https://vi-p-yemen.vercel.app"
          check "Render mirror"   "https://vipyemen.onrender.com"
          check "GitHub Pages"    "https://deltastars-com.github.io/ViPYemen-/"
          check "Convex backend"  "https://notable-shepherd-367.convex.cloud"
          check "Convex HTTP"     "https://notable-shepherd-367.convex.site/health"

          # مرايا إضافية اختيارية (Netlify / Cloudflare Pages …) — متغير مستودع
          if [ -n "${EXTRA_MIRROR_URLS:-}" ]; then
            IFS=',' read -ra EXTRA <<< "$EXTRA_MIRROR_URLS"
            for entry in "${EXTRA[@]}"; do
              check "${entry%%|*}" "${entry#*|}"
            done
          fi

          if [ -z "$FAILED" ]; then
            echo "✔ all channels healthy"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Outage detected on one or more channels"
            printf "failed=true\n" >> "$GITHUB_OUTPUT"
            # '%s' so a report starting with "- " is never parsed as printf options
            printf '%s' "$FAILED" > /tmp/outage.md
          fi

      - name: Report outage as a single tracked issue
        if: steps.probe.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="[uptime] channel outage detected"
          BODY=$(printf 'فحص تلقائي وجد قناة تشغيل لا تستجيب:\n\n%s\n\nزمن الفحص: `%s`\nالتشغيل: %s/%s/actions/runs/%s\n\n> التطبيقات الأصلية (APK/AAB/iOS) لا تتأثر: واجهتها مدمجة داخل الحزمة وتعمل حتى لو توقفت كل الاستضافات. هذا التنبيه يخص مواقع الويب + الباك اند وحدهما.' \
            "$(cat /tmp/outage.md)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          # --repo صريح: هذه المهمة بلا actions/checkout، فيحتاج gh تحديد المستودع
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title channel outage" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "updated issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "opened a new outage issue"
          fi

      - name: Auto-close the outage issue when everything is healthy again
        if: steps.probe.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title channel outage" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "✅ كل القنوات عادت للعمل بشكل طبيعي ($(date -u +%Y-%m-%dT%H:%M:%SZ)). يُغلق التنبيه تلقائياً."
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "closed issue #$EXISTING"
          else
            echo "✔ no open outage issue"
          fi
