name: Uptime watchdog (continuity monitor)

# Free, proactive monitoring of every public channel the platform depends on.
# Runs every 6 hours and on demand. If any mirror or the backend stops
# answering it opens (or updates) a single GitHub issue — so an outage is
# reported within hours without any paid monitoring service, and the issue is
# closed automatically on the first successful sweep.
#
# The APK/AAB/iOS apps are self-contained (assets bundled inside the package,
# see the release workflow) — this watchdog exists so the WEB mirrors and the
# shared backend are always verified too.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-watchdog
  cancel-in-progress: true

jobs:
  probe:
    name: Probe mirrors + backend
    runs-on: ubuntu-latest
    steps:
      - name: Check every public channel
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          FAILED=""
          check() {
            local name="$1" url="$2"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "$url" 2>/dev/null || echo 000)
            printf '%-24s %s\n' "$name" "$code"
            [ "$code" = "200" ] || FAILED="${FAILED}- **${name}** → HTTP ${code} (${url})\n"
          }

          check "Vercel mirror"  "https://vi-p-yemen.vercel.app"
          check "Render mirror"  "https://vipyemen.onrender.com"
          check "GitHub Pages"   "https://deltastars-com.github.io/ViPYemen-/"
          check "Convex backend" "https://notable-shepherd-367.convex.cloud"

          if [ -z "$FAILED" ]; then
            echo "✔ all channels healthy"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Outage detected on one or more channels"
            printf "failed=true\n" >> "$GITHUB_OUTPUT"
            printf "$FAILED" > /tmp/outage.md
          fi

      - name: Report outage as a single tracked issue
        if: steps.probe.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="[uptime] channel outage detected"
          BODY=$(printf 'فحص تلقائي وجد قناة تشغيل لا تستجيب:\n\n%s\n\nزمن الفحص: `%s`\nالتشغيل: %s/%s/actions/runs/%s\n\n> التطبيقات الأصلية (APK/AAB/iOS) لا تتأثر: واجهتها مدمجة داخل الحزمة وتعمل حتى لو توقفت كل الاستضافات. هذا التنبيه يخص مواقع الويب + الباك اند وحدهما.' \
            "$(cat /tmp/outage.md)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          EXISTING=$(gh issue list --state open --search "in:title channel outage" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "opened a new outage issue"
          fi

      - name: Auto-close the outage issue when everything is healthy again
        if: steps.probe.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          EXISTING=$(gh issue list --state open --search "in:title channel outage" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "✅ كل القنوات عادت للعمل بشكل طبيعي ($(date -u +%Y-%m-%dT%H:%M:%SZ)). يُغلق التنبيه تلقائياً."
            gh issue close "$EXISTING" --reason completed
            echo "closed issue #$EXISTING"
          else
            echo "✔ no open outage issue"
          fi
