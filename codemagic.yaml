# =============================================================================
# ViP Yemen — Codemagic CI/CD (Android APK/AAB + iOS IPA)
# =============================================================================
# 1. Connect this repository to Codemagic (codemagic.io → Add application →
#    "Open in codemagic start" → GitHub).
# 2. In Codemagic → Environment variables → create a group named
#    `keystore_credentials` with:
#      CM_KEYSTORE          — base64 of your release .jks keystore
#      CM_KEYSTORE_PASSWORD — keystore password
#      CM_KEY_ALIAS         — key alias
#      CM_KEY_PASSWORD      — key password
#    (iOS signing: Codemagic "iOS code signing" with Apple Developer account,
#     bundle id com.vip.yemen)
# 3. Every push (or manual build) now builds real signed apps automatically.
# =============================================================================

workflows:
  android-build:
    name: Android APK + AAB (com.vip.yemen)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: com.vip.yemen
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install --frozen-lockfile
      - name: Generate icons
        script: bun run icons
      - name: Build web (PWA assets)
        script: bun run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Configure release keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > android/keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build release APK and AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - dist/**/*.js
    publishing:
      email:
        recipients:
          - vipservicesyemen@gmail.com
        notify:
          success: true
          failure: true

  ios-build:
    name: iOS IPA (com.vip.yemen)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vip.yemen
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install --frozen-lockfile
      - name: Generate icons
        script: bun run icons
      - name: Build web (PWA assets)
        script: bun run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Archive and export IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -derivedDataPath build archive \
            -archivePath build/App.xcarchive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vipservicesyemen@gmail.com
        notify:
          success: true
          failure: true