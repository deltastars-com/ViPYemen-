# Codemagic CI/CD — ViP Yemen iOS builds
# Docs: https://docs.codemagic.io/getting-started/yaml
#
# Required environment variables in Codemagic → Team settings:
#   APP_STORE_CONNECT_PRIVATE_KEY    — App Store Connect API key (.p8)
#   APP_STORE_CONNECT_KEY_ID         — API key ID
#   APP_STORE_CONNECT_ISSUER_ID      — Issuer ID
#   CERTIFICATE_PRIVATE_KEY          — Apple Distribution cert (.p12, base64)
#   CERTIFICATE_PASSWORD             — Certificate password
#   PROVISIONING_PROFILE_DATA        — App Store provisioning profile (base64)
#   VITE_CONVEX_URL                  — Convex project URL
#   VITE_SUPABASE_URL                — Supabase project URL
#   VITE_SUPABASE_ANON_KEY           — Supabase anon key
#   VITE_GEMINI_KEY                  — Gemini API key

workflows:
  ios-release:
    name: ViP Yemen iOS Release
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
        - vite_env
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          brew install bun
          bun install
      - name: Build web assets
        script: bun run build
      - name: Set up code signing
        script: |
          cd ios/App
          # Decode Apple Distribution certificate and import into a keychain
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          # Decode and install the App Store provisioning profile where
          # xcodebuild expects it
          echo "$PROVISIONING_PROFILE_DATA" | base64 --decode > ViP_Yemen.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ViP_Yemen.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/ViP_Yemen.mobileprovision"
      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            archive
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build/output
    artifacts:
      - ios/App/build/output/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID