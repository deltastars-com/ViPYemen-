# Codemagic CI/CD — ViP Yemen mobile builds
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/

workflows:
  # ── Android APK + AAB ────────────────────────────────────────────────
  android-release:
    name: Android Release (APK + AAB)
    max_build_duration: 60
    environment:
      flutter: none
      xcode: none
      cocoapods: none
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate icons
        script: npm run icons
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Decode keystore
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/vipyemen-release.p12
          fi
      - name: Build APK (debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build AAB (release)
        script: |
          cd android
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            ./gradlew bundleRelease --no-daemon
          else
            echo "⚠️ No keystore — building unsigned AAB"
            ./gradlew bundleRelease --no-daemon
          fi
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - vipservicesyemen@gmail.com

  # ── iOS Archive ──────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (Archive)
    max_build_duration: 60
    environment:
      flutter: none
      node: none
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate icons
        script: npm run icons
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update
      - name: Build iOS Archive (unsigned)
        script: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -20
      - name: Package IPA
        script: |
          set -e
          mkdir -p release/ios/Payload
          APP_PATH=$(find ios/App/build/Build/Products -type d -name 'App.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ App.app not found"
            exit 1
          fi
          cp -R "$APP_PATH" release/ios/Payload/
          cd release/ios && zip -qry vip-yemen-ios.ipa Payload
          echo "✅ IPA packaged"
    artifacts:
      - release/ios/*.ipa
    publishing:
      email:
        recipients:
          - vipservicesyemen@gmail.com
