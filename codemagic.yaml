# =============================================================================
# ViP Yemen — Codemagic CI/CD (codemagic.yaml)
# Automated Android + iOS builds triggered on every push to main / on tags.
# https://codemagic.io — connect the GitHub repo, set the workflow to this file.
#
# Required environment variables (set in Codemagic → App → Environment variables):
#   ANDROID_KEYSTORE_B64        — base64 of keystore/vipyemen-release.p12
#   ANDROID_KEYSTORE_PASSWORD   — keystore password
#   ANDROID_KEY_ALIAS           — key alias (vipyem9en)
#   ANDROID_KEY_PASSWORD        — key password
#   APP_STORE_CONNECT_KEY_ID / ISSUER_ID / PRIVATE_KEY  (iOS, optional until ASC is ready)
#   CERTIFICATE_PRIVATE_KEY / CERTIFICATE_PASSWORD / PROVISIONING_PROFILE_DATA (iOS)
# =============================================================================

workflows:
  android-release:
    name: ViP Yemen — Android APK & AAB
    max_build_duration: 40
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Set up Node + Bun
        script: |
          brew list --formula | grep -q "^bun$" || brew install bun
          bun --version
      - name: Install dependencies
        script: bun install --frozen-lockfile
      - name: Build web bundle (dist/)
        script: bun run build
      - name: Sync Capacitor Android
        script: |
          cd android
          rm -rf app/src/main/assets/public
          npx cap sync android
      - name: Decode keystore and write keystore.properties
        script: |
          echo $ANDROID_KEYSTORE_B64 | base64 --decode > android/keystore/vipyemen-release.p12
          cat > android/keystore.properties <<'EOF'
          storeFile=keystore/vipyemen-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeType=pkcs12
          EOF
      - name: Build signed AAB + APK
        script: |
          cd android
          ./gradlew clean bundleRelease assembleRelease
      - name: Verify signature
        script: |
          APKS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKS verify --print-certs android/app/build/outputs/apk/release/app-release.apk
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - vipservicesyemen@gmail.com

  ios-build:
    name: ViP Yemen — iOS IPA (unsigned / ASC-ready)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Set up Node + Bun
        script: |
          brew list --formula | grep -q "^bun$" || brew install bun
          bun --version
      - name: Install dependencies
        script: bun install --frozen-lockfile
      - name: Build web bundle (dist/)
        script: bun run build
      - name: Sync Capacitor iOS
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies
          cd ../..
          npx cap sync ios
      - name: Archive (unsigned — sign via ASC vars when provided)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            archive
      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates || \
          mkdir -p build/output && \
          cp -r build/App.xcarchive/Products/Applications build/output/Payload && \
          cd build/output && zip -r ../ViPYemen-unsigned.ipa Payload && cd ../../..
    artifacts:
      - ios/App/build/output/*.ipa
      - ios/App/build/*.xcarchive
    publishing:
      email:
        recipients:
          - vipservicesyemen@gmail.com
