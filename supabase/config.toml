# ViP Yemen — Supabase Configuration
# Project: etgkhpasgfgeofifditu (https://etgkhpasgfgeofifditu.supabase.co)
# This file configures the local dev environment and CI/CD migrations.

[project]
id = "etgkhpasgfgeofifditu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "https://vi-p-yemen.vercel.app"
additional_redirect_urls = [
  "https://deltastars-com.github.io/ViPYemen-/",
  "http://localhost:5173"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[db]
# Port to expose the local Postgres. Required for `supabase db push` and `supabase migration` commands.
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Branching configuration (Supabase CI/CD)
[experimental]
branch_main = "main"